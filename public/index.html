<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Postulantes & Evaluador ATS</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* ESTILOS MODERNOS UI/UX */
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; color: #1f2937; margin: 0; padding: 30px 15px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; color: #111827; margin-bottom: 30px; font-weight: 700; }
        h2 { font-size: 1.25rem; color: #374151; border-bottom: 2px solid #e5e7eb; padding-bottom: 10px; margin-top: 0; margin-bottom: 20px; }
        .card { background-color: #ffffff; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); padding: 25px; margin-bottom: 25px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.875rem; font-weight: 600; color: #4b5563; margin-bottom: 5px; }
        input[type="text"], input[type="email"], input[type="tel"], textarea, select {
            width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 0.95rem; background-color: #f9fafb; box-sizing: border-box;
        }
        input:focus, textarea:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); background-color: #ffffff; }
        textarea { resize: vertical; min-height: 100px; }
        .btn-group { display: flex; gap: 15px; margin-top: 20px; }
        button { padding: 12px 20px; border: none; border-radius: 6px; font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: 0.2s; font-family: 'Inter', sans-serif; }
        .btn-primary { background-color: #2563eb; color: white; width: 100%; }
        .btn-primary:hover { background-color: #1d4ed8; }
        .btn-success { background-color: #10b981; color: white; width: 100%; }
        .btn-success:hover { background-color: #059669; }
        .btn-outline { background-color: transparent; color: #4b5563; border: 1px solid #d1d5db; }
        .btn-outline:hover { background-color: #f3f4f6; }
        #resultadoAts { margin-top: 15px; padding: 15px; border-radius: 6px; background-color: #eff6ff; color: #1e3a8a; font-weight: 600; display: none; }
        @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } .btn-group { flex-direction: column; } }
    </style>
</head>
<body>

<div class="container">
    <h1>📋 Gestor de CVs y Evaluación ATS</h1>

    <div class="card">
        <h2>⚡ Extraer datos del CV</h2>
        <div class="grid-2">
            <div class="form-group" style="grid-column: span 2;">
                <label>Extraer desde CV (PDF o Word):</label>
                <input type="file" id="archivoCV" accept=".pdf,.doc,.docx">
                <!-- LE AGREGAMOS EL ID btnProcesar A ESTE BOTON -->
                <button class="btn-outline" id="btnProcesar" style="margin-top:10px; width:100%;">📄 Procesar Archivo</button>
            </div>
        </div>
    </div>

    <div class="card">
        <h2>👤 Datos Personales</h2>
        <div class="grid-2">
            <div class="form-group"><label>Nombre Completo *</label><input type="text" id="nombre"></div>
            <div class="form-group"><label>Puesto u Objetivo *</label><input type="text" id="puesto"></div>
            <div class="form-group"><label>Correo Electrónico *</label><input type="email" id="email"></div>
            <div class="form-group"><label>Teléfono *</label><input type="tel" id="telefono"></div>
            <div class="form-group"><label>Ubicación</label><input type="text" id="ubicacion"></div>
            <div class="form-group"><label>Perfil LinkedIn</label><input type="text" id="linkedin"></div>
        </div>
    </div>

    <div class="card">
        <h2>📄 Contenido del Curriculum</h2>
        <div class="form-group"><label>Resumen / Contenido Extraído</label><textarea id="resumen"></textarea></div>
        <div class="form-group"><label>Experiencia Laboral</label><textarea id="experiencia"></textarea></div>
        <div class="form-group"><label>Educación y Cursos</label><textarea id="educacion"></textarea></div>
        <div class="form-group"><label>Habilidades Técnicas</label><textarea id="habilidades"></textarea></div>
        <div class="form-group"><label>Información Adicional</label><textarea id="adicional"></textarea></div>
        <div class="btn-group">
            <button class="btn-primary" id="btnGuardar">💾 Guardar Postulante</button>
            <button class="btn-success" id="btnGenerarPDF">🚀 Generar PDF Final ATS</button>
        </div>
    </div>
</div>

<!-- Librerías mágicas para leer PDF y Word -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="generar-cv.js"></script>

</body>
</html>
