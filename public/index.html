<script>
document.getElementById('uploadForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const formData = new FormData(this);

    try {
        const response = await fetch('/api/upload-cv', {
            method: 'POST',
            body: formData
        });
        
        const data = await response.json();
        
        if (data.success) {
            // Función auxiliar para buscar el elemento por múltiples selectores y asignarle valor
            const asignarValorFlexible = (selectors, valor) => {
                for (let sel of selectors) {
                    const el = document.querySelector(sel) || document.getElementById(sel);
                    if (el) {
                        el.value = valor || '';
                        break;
                    }
                }
            };

            // Mapeo seguro para datos personales
            asignarValorFlexible(['#nombreInput', '#nombre', 'input[name="nombre"]'], data.nombre);
            asignarValorFlexible(['#emailInput', '#email', '#correo', 'input[name="email"]'], data.email);
            asignarValorFlexible(['#telefonoInput', '#telefono', '#phone', 'input[name="telefono"]'], data.telefono);
            asignarValorFlexible(['#domicilioInput', '#domicilio', '#direccion', 'input[name="domicilio"]'], data.domicilio);
            asignarValorFlexible(['#disponibilidadInput', '#disponibilidad', 'input[name="disponibilidad"]'], data.disponibilidad || 'Inmediata');
            
            // Texto completo extraído sin recortes para las secciones grandes
            const textoCompleto = data.rawText || data.resumen || '';

            asignarValorFlexible(['#resumenInput', '#resumen', 'textarea[name="resumen"]'], textoCompleto);
            asignarValorFlexible(['#experienciaInput', '#experiencia', 'textarea[name="experiencia"]'], textoCompleto);
            asignarValorFlexible(['#estudiosInput', '#estudios', '#educacion', 'textarea[name="estudios"]'], textoCompleto);
            asignarValorFlexible(['#habilidadesInput', '#habilidades', '#skills', 'textarea[name="habilidades"]'], textoCompleto);

            alert('¡CV analizado y extraído correctamente!');
        } else {
            alert('Error: ' + data.error);
        }
    } catch (err) {
        console.error(err);
        alert('Error interno al procesar el archivo.');
    }
});
</script>
